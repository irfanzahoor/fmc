name: CI v16

on:
  push:
    branches: [master, main, develop]
  pull_request:

concurrency:
  group: v16-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Frappe v16 + ERPNext v16
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: food_manufacturing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcups2-dev mariadb-client
          npm install -g yarn

      - name: Configure MariaDB for Frappe
        run: |
          mysql --host 127.0.0.1 --port 3306 -uroot -proot -e \
            "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Install bench
        run: pip install frappe-bench

      - name: Init bench on version-16
        run: |
          bench init \
            --skip-redis-config-generation \
            --frappe-branch version-16 \
            --python "$(which python)" \
            ~/frappe-bench

      - name: Point bench at CI services
        working-directory: /home/runner/frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache "redis://127.0.0.1:6379"
          bench set-config -g redis_queue "redis://127.0.0.1:6379"
          bench set-config -g redis_socketio "redis://127.0.0.1:6379"
          bench set-config -g developer_mode 1

      - name: Get ERPNext version-16
        working-directory: /home/runner/frappe-bench
        run: bench get-app --branch version-16 --resolve-deps erpnext

      - name: Record exact commits under test
        working-directory: /home/runner/frappe-bench
        run: |
          echo "### Versions under test" >> $GITHUB_STEP_SUMMARY
          for app in frappe erpnext; do
            echo "- $app $(git -C apps/$app describe --tags) \
              $(git -C apps/$app rev-parse HEAD)" >> $GITHUB_STEP_SUMMARY
          done

      - name: Get food_manufacturing
        working-directory: /home/runner/frappe-bench
        run: bench get-app food_manufacturing $GITHUB_WORKSPACE/food_manufacturing

      - name: Create a clean site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site ci.localhost \
            --mariadb-user-host-login-scope='%' \
            --db-root-password root \
            --admin-password admin \
            --install-app erpnext

      - name: Install app (fresh install)
        working-directory: /home/runner/frappe-bench
        run: bench --site ci.localhost install-app food_manufacturing

      - name: Migrate (must be idempotent - run twice)
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site ci.localhost migrate
          bench --site ci.localhost migrate

      - name: Build assets
        working-directory: /home/runner/frappe-bench
        run: bench build --app food_manufacturing

      - name: Build operator frontend
        working-directory: food_manufacturing/frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Prepare disposable test fixtures
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site ci.localhost set-config fm_isolated_test_site true
          bench --site ci.localhost execute food_manufacturing.tests.ci_setup.prepare

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site ci.localhost set-config allow_tests true
          bench --site ci.localhost run-tests --app food_manufacturing --failfast

      - name: Test concurrent stock postings
        working-directory: /home/runner/frappe-bench
        run: bench --site ci.localhost execute food_manufacturing.tests.concurrency.run

      - name: Dump logs on failure
        if: failure()
        working-directory: /home/runner/frappe-bench
        run: tail -n 200 logs/*.log || true
