	.proposal-bar {
		max-width: 210mm;
		margin: 0 auto;
		padding: 10px 18mm;
		display: flex;
		justify-content: flex-end;
	}
	.proposal-download {
		display: inline-flex;
		align-items: center;
		gap: 8px;
		padding: 9px 16px;

		color: #ffffff;
		font-weight: 600;
		font-size: 10pt;
		text-decoration: none;
	}
	.proposal-download:hover { background: #06301a; color: #ffffff; }

{% endblock %}

{% block page_content %}
