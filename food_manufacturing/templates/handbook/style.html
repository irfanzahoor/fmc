{# Shared by the handbook pages and their PDFs. wkhtmltopdf renders with print
   media, so the print rules are not an afterthought here - anything that only
   works on screen has to be undone under @media print. #}
<style>
{% include "templates/includes/brand.html" %}

	* { box-sizing: border-box; }

	body {
		margin: 0;
		background: #eef2ef;
		color: var(--ink);
		font-family: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
		font-size: 10.5pt;
		line-height: 1.6;
		-webkit-font-smoothing: antialiased;
	}

	.hb { max-width: 1180px; margin: 0 auto; padding: 0 20px 60px; }

	/* --- masthead ---------------------------------------------------------- */

	.mast {
		margin: 0 -20px 28px;
		padding: 30px 40px 26px;
		background: var(--green);
		color: #ffffff;
	}
	.mast-mark svg { width: 38px; height: 38px; vertical-align: middle; }
	.mast-mark > div { display: inline-block; vertical-align: middle; margin-left: 11px; }
	.mast-brand { margin: 0; font-size: 15pt; font-weight: 800; letter-spacing: -0.015em; color: #ffffff; }
	.mast-sub { margin: 1px 0 0; font-size: 8.5pt; color: #c2d6c9; }

	.mast h1 {
		margin: 26px 0 0;
		color: #ffffff;
		font-size: 27pt;
		line-height: 1.15;
		font-weight: 800;
		letter-spacing: -0.02em;
	}
	.mast .lede { margin: 10px 0 0; max-width: 640px; font-size: 11.5pt; color: #d4e3da; }
	.mast .who {
		display: inline-block;
		margin-top: 18px;
		padding: 4px 11px;
		border: 1px solid rgba(204, 162, 60, 0.55);
		border-radius: 999px;
		font-size: 8.5pt;
		letter-spacing: 0.06em;
		text-transform: uppercase;
		color: var(--gold);
	}

	/* --- layout ------------------------------------------------------------ */

	.cols { display: flex; gap: 40px; align-items: flex-start; }
	.side { flex: 0 0 232px; position: sticky; top: 20px; }
	.main { flex: 1 1 auto; min-width: 0; max-width: 760px; }
	.cols.wide .main { max-width: none; }

	.side h2 {
		margin: 0 0 10px;
		font-size: 8pt;
		letter-spacing: 0.1em;
		text-transform: uppercase;
		color: var(--muted);
		border: 0;
		padding: 0;
	}
	.side ol { margin: 0 0 22px; padding: 0; list-style: none; counter-reset: s; }
	.side li { counter-increment: s; }
	/* Scoped to the ordered list: the "other guides" links below it are not
	   list items, and an unscoped counter printed a stray digit over them. */
	.side ol a {
		display: block;
		padding: 5px 10px 5px 26px;
		border-left: 2px solid var(--rule);
		color: var(--ink);
		font-size: 9.5pt;
		text-decoration: none;
		position: relative;
	}
	.side ol a::before {
		content: counter(s);
		position: absolute;
		left: 9px;
		color: var(--muted);
		font-size: 8pt;
	}
	.side ol a:hover, .side ol a:focus-visible { border-left-color: var(--gold); background: var(--gold-soft); }
	.side .other { display: block; padding: 4px 0; font-size: 9.5pt; color: var(--green); text-decoration: none; }

	/* --- content ----------------------------------------------------------- */

	.main > section { margin-bottom: 34px; }

	h2 {
		margin: 0 0 12px;
		padding-bottom: 7px;
		border-bottom: 1px solid var(--rule);
		font-size: 15pt;
		font-weight: 800;
		letter-spacing: -0.015em;
		color: var(--green);
		page-break-after: avoid;
	}
	h3 {
		margin: 20px 0 6px;
		font-size: 11pt;
		font-weight: 700;
		color: var(--green);
		page-break-after: avoid;
	}
	p { margin: 0 0 10px; }
	em { font-style: normal; font-weight: 600; }
	code {
		font-family: ui-monospace, "SF Mono", Menlo, monospace;
		font-size: 9pt;
		background: var(--green-soft);
		padding: 1px 4px;
		border-radius: 3px;
	}
	a { color: var(--gold-ink); }

	ul, ol { margin: 0 0 10px; padding-left: 20px; }
	li { margin-bottom: 4px; page-break-inside: avoid; }

	pre {
		margin: 0 0 12px;
		padding: 11px 13px;
		background: var(--green-deep);
		color: #d9e6de;
		border-radius: 6px;
		font-size: 8.5pt;
		line-height: 1.5;
		overflow-x: auto;
		page-break-inside: avoid;
	}
	pre code { background: none; color: inherit; padding: 0; font-size: inherit; }

	/* Rows are blocks, not table rows: wkhtmltopdf splits a <tr> across a page
	   break however it is styled, but honours page-break-inside on a block.
	   The ARIA roles keep the table semantics a screen reader needs. */
	.matrix { margin: 0 0 12px; }
	.mhead, .mrow { font-size: 0; page-break-inside: avoid; }
	.mhead > span, .mrow > span {
		display: inline-block;
		vertical-align: top;
		padding: 7px 10px;
		font-size: 9.5pt;
	}
	.mhead { background: var(--green-soft); page-break-after: avoid; }
	.mhead > span {
		color: var(--green);
		font-size: 7.5pt;
		text-transform: uppercase;
		letter-spacing: 0.08em;
		font-weight: 700;
	}
	.mrow { border-bottom: 1px solid var(--rule); }
	.mrow > .mk { color: var(--green); font-weight: 600; }
	.two .mk { width: 32%; }
	.two .mv { width: 68%; }
	.three .mk { width: 24%; }
	.three .ms { width: 24%; }
	.three .mv { width: 52%; }

	.note, .warn {
		margin: 14px 0;
		padding: 11px 14px;
		border-left: 3px solid var(--gold);
		background: var(--gold-soft);
		color: var(--gold-ink);
		font-size: 9.5pt;
		page-break-inside: avoid;
	}
	.note p:last-child, .warn p:last-child { margin-bottom: 0; }
	.warn { border-left-color: #a8422a; background: #fbeeea; color: #7d2f1c; }

	/* --- landing ----------------------------------------------------------- */

	/* Flex, not inline-block: three columns at exactly 33.333% round up past
	   the line and drop the third card. The landing page has no PDF, so the
	   wkhtmltopdf constraint that rules flexbox out elsewhere does not apply. */
	.hb-cards { display: flex; flex-wrap: wrap; gap: 18px; }
	.hb-card {
		flex: 1 1 260px;
		min-width: 0;
		padding: 20px;
		background: var(--paper);
		border: 1px solid var(--rule);
		border-top: 3px solid var(--gold);
		border-radius: 8px;
		font-size: 10.5pt;
		text-decoration: none;
		color: var(--ink);
	}
	.hb-card:hover, .hb-card:focus-visible { border-color: var(--gold); box-shadow: 0 6px 18px rgba(12, 66, 36, 0.09); }
	.hb-card h3 { margin: 0 0 3px; font-size: 13pt; }
	.hb-card .who2 { margin: 0 0 9px; font-size: 8pt; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
	.hb-card p { margin: 0; font-size: 9.5pt; color: var(--muted); }

	.panel {
		background: var(--paper);
		border: 1px solid var(--rule);
		border-radius: 8px;
		padding: 22px 26px;
		margin-bottom: 22px;
	}

	/* --- chrome ------------------------------------------------------------ */

	.bar { margin-bottom: 14px; font-size: 9.5pt; }
	.bar a { color: var(--green); text-decoration: none; }
	.bar .pdf {
		float: right;
		display: inline-block;
		padding: 7px 15px;
		background: var(--green);
		color: #ffffff;
		border-radius: 6px;
		font-size: 9.5pt;
		font-weight: 600;
		text-decoration: none;
	}
	.bar .pdf:hover, .bar .pdf:focus-visible { background: var(--green-deep); color: #ffffff; }

	.foot {
		margin-top: 34px;
		padding-top: 12px;
		border-top: 2px solid var(--gold);
		font-size: 8.5pt;
		color: var(--muted);
	}
	.foot p { margin: 0 0 4px; }

	a:focus-visible, .hb-card:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: 2px; }

	@media (prefers-reduced-motion: reduce) {
		* { transition: none !important; animation: none !important; }
	}

	/* --- phones and small tablets ------------------------------------------
	   Screen only: the PDF renders with print media and never sees this. */
	@media screen and (max-width: 820px) {
		.hb { padding: 0 14px 40px; }
		.mast { margin: 0 -14px 20px; padding: 22px 16px 20px; }
		.mast h1 { font-size: 20pt; }
		.mast .lede { font-size: 10.5pt; }
		.cols { display: block; }
		.side { position: static; margin-bottom: 26px; }
		.hb-card { display: block; width: 100%; margin: 0 0 14px; }

		.mhead { display: none; }
		.mrow { padding: 8px 0; }
		.matrix .mrow > span { display: block; width: 100%; padding: 2px 0; }
		.three .mrow > span::before { content: attr(data-l) " — "; color: var(--green); font-weight: 700; }
	}

	@media print {
		body { background: var(--paper); font-size: 9.5pt; }
		.hb-cards { display: block; }
		.hb { max-width: none; padding: 0 16mm 10mm; }
		.mast { margin: 0 -16mm 9mm; padding: 13mm 16mm 9mm; }
		.mast h1 { font-size: 23pt; }
		/* The sidebar is a navigation aid; on paper the contents page does that
		   job and a sticky column would simply repeat every heading. */
		.side, .no-print { display: none !important; }
		.cols { display: block; }
		.main { max-width: none; }
		a { color: var(--ink); text-decoration: none; }
		pre { background: #f2f6f3; color: #16301f; border: 1px solid var(--rule); }
		.hb-card { display: block; width: 100%; margin: 0 0 4mm; }
	}
</style>
