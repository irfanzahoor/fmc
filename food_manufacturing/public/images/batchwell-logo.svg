<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Batchwell">
	<title>Batchwell</title>
	<!--
		Redrawn from the supplied brand artwork, which carries a band of black
		and colour noise down its right edge - visible once scaled to icon size.
		Same mark, same sampled colours (#0c4224 forest, #cca23c gold), as
		geometry so it stays crisp at 24px and costs about a kilobyte.
	-->
	<rect width="64" height="64" rx="14" fill="#0c4224"/>

	<!-- The B: one path, counters knocked out with evenodd. -->
	<path
		fill="#ffffff" fill-rule="evenodd"
		d="M17 12h20.5a10.5 10.5 0 0 1 3.1 20.5A11 11 0 0 1 38.2 52H17Z
		   M25 19.2v8.9h11.4a4.45 4.45 0 0 0 0-8.9Z
		   M25 35.6v9.2h12.2a4.6 4.6 0 0 0 0-9.2Z"
	/>

	<!-- Gold leaf, angled up and right through the waist of the B, as in the
	     artwork: tail at the lower left, tip breaking past the stem. -->
	<path
		fill="#cca23c"
		d="M21.8 45.4c1.2-9 7.4-15.8 17-18.6-.4 10.2-6.6 17.2-17 18.6Z"
	/>
	<path
		fill="#0c4224" fill-opacity="0.28"
		d="M22.6 44.8c3.3-7.5 8.7-13.2 15.6-16.6-5.3 5-10.1 10.7-14 16.9Z"
	/>
</svg>
